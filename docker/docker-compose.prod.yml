# Elevo Workspace - Production Docker Compose
#
# Quick start:
#   cd docker
#   cp .env.example .env   # edit as needed
#   docker compose -f docker-compose.prod.yml up -d
#
# Verify:
#   curl http://localhost:8080/api/v1/health

services:
  workspace-server:
    image: ${ELEVO_IMAGE:-ghcr.io/openelevo/elevosandbox-server}:${ELEVO_VERSION:-latest}
    container_name: elevo-workspace-server
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRPC_PORT:-9090}:9090"
    environment:
      - RUST_LOG=${RUST_LOG:-info,workspace_server=info}

      # Database
      - WORKSPACE_DATABASE_URL=sqlite:/data/workspace.db?mode=rwc

      # Docker
      - WORKSPACE_DOCKER_SOCKET=/var/run/docker.sock

      # Workspace storage
      - WORKSPACE_WORKSPACE_DIR=/data/workspaces
      - WORKSPACE_WORKSPACE_HOST_DIR=${WORKSPACE_HOST_DIR:-/var/lib/elevo-workspace/workspaces}

      # NFS
      - WORKSPACE_NFS_MODE=embedded
      - WORKSPACE_NFS_PORT=2049

      # Base image for sandbox containers
      - WORKSPACE_BASE_IMAGE=${ELEVO_BASE_IMAGE:-ghcr.io/openelevo/elevosandbox-base}:${ELEVO_BASE_VERSION:-latest}

      # Agent
      - WORKSPACE_AGENT_TIMEOUT=${AGENT_TIMEOUT:-60}
      - WORKSPACE_AGENT_SERVER_ADDR=http://host.docker.internal:9090
      - WORKSPACE_SANDBOX_EXTRA_HOSTS=host.docker.internal:host-gateway

      # Sandbox lifecycle
      - WORKSPACE_MAX_IDLE_TIME=${MAX_IDLE_TIME:-7200}

      # MCP
      - WORKSPACE_MCP_MODE=${MCP_MODE:-disabled}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - elevo-workspace-data:/data
      - ${WORKSPACE_HOST_DIR:-/var/lib/elevo-workspace/workspaces}:/data/workspaces

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - elevo-workspace-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  elevo-workspace-data:
    driver: local

networks:
  elevo-workspace-net:
    driver: bridge
