# Elevo Workspace - Production Docker Compose
#
# Quick start:
#   cd docker
#   cp .env.example .env   # edit as needed
#   docker compose -f docker-compose.prod.yml up -d
#
# Verify:
#   curl http://localhost:8080/api/v1/health

services:
  postgres:
    image: postgres:17-alpine
    container_name: elevo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elevo}
      POSTGRES_DB: ${POSTGRES_DB:-elevo}
    volumes:
      - elevo-pg-data:/var/lib/postgresql/data
    networks:
      - elevo-workspace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elevo}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  workspace-server:
    image: ${ELEVO_IMAGE}:${ELEVO_VERSION:-latest}
    container_name: elevo-workspace-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRPC_PORT:-9090}:9090"
    environment:
      - RUST_LOG=${RUST_LOG:-info,workspace_server=info}

      # Database
      - WORKSPACE_DATABASE_URL=postgres://${POSTGRES_USER:-elevo}:${POSTGRES_PASSWORD:-elevo}@postgres:5432/${POSTGRES_DB:-elevo}

      # Docker
      - WORKSPACE_DOCKER_SOCKET=/var/run/docker.sock

      # Workspace storage
      - WORKSPACE_WORKSPACE_DIR=/data/workspaces
      - WORKSPACE_WORKSPACE_HOST_DIR=${WORKSPACE_HOST_DIR:-/var/lib/elevo-workspace/workspaces}

      # NFS
      - WORKSPACE_NFS_MODE=embedded
      - WORKSPACE_NFS_PORT=2049

      # Base image for sandbox containers
      - WORKSPACE_BASE_IMAGE=${ELEVO_BASE_IMAGE}:${ELEVO_VERSION:-latest}

      # Agent
      - WORKSPACE_AGENT_TIMEOUT=${AGENT_TIMEOUT:-60}
      - WORKSPACE_AGENT_SERVER_ADDR=http://host.docker.internal:${GRPC_PORT:-9090}
      - WORKSPACE_SANDBOX_EXTRA_HOSTS=host.docker.internal:host-gateway

      # Sandbox lifecycle
      - WORKSPACE_MAX_IDLE_TIME=${MAX_IDLE_TIME:-7200}

      # MCP
      - WORKSPACE_MCP_MODE=${MCP_MODE:-disabled}

    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - elevo-workspace-data:/data
      - ${WORKSPACE_HOST_DIR:-/var/lib/elevo-workspace/workspaces}:/data/workspaces

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - elevo-workspace-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  elevo-workspace-data:
    driver: local
  elevo-pg-data:
    driver: local

networks:
  elevo-workspace-net:
    driver: bridge
