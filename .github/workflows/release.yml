name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-server:
    name: Build Server (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('**/Cargo.lock') }}

      - name: Build server binaries
        run: |
          cargo build --release --package workspace-server --package workspace-agent
          mkdir -p artifacts
          cp target/release/workspace-server artifacts/
          cp target/release/workspace-agent artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: artifacts/

  build-fuse-client:
    name: Build FUSE Client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl tools (amd64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuse-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace-fuse (musl, amd64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo build --release --package workspace-fuse --target ${{ matrix.target }}
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/workspace-fuse artifacts/workspace-fuse-linux-${{ matrix.arch }}

      - name: Build workspace-fuse with cross (arm64)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          cross build --release --package workspace-fuse --target ${{ matrix.target }}
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/workspace-fuse artifacts/workspace-fuse-linux-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuse-client-${{ matrix.arch }}
          path: artifacts/

  build-and-push:
    name: Build and Push Docker Images
    needs: [build-server, build-fuse-client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "server_image=ghcr.io/${OWNER}/elevosandbox-server" >> $GITHUB_OUTPUT
          echo "base_image=ghcr.io/${OWNER}/elevosandbox-base" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_short=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-binaries
          path: target/release/

      - name: Download fuse-client amd64
        uses: actions/download-artifact@v4
        with:
          name: fuse-client-amd64
          path: target/

      - name: Download fuse-client arm64
        uses: actions/download-artifact@v4
        with:
          name: fuse-client-arm64
          path: target/

      - name: Prepare binaries
        run: |
          chmod +x target/release/workspace-server target/release/workspace-agent
          chmod +x target/workspace-fuse-linux-*
          ls -la target/release/ target/

      - name: Build and push server image
        run: |
          docker build -t ${{ steps.images.outputs.server_image }}:${{ steps.version.outputs.version }} \
                       -t ${{ steps.images.outputs.server_image }}:${{ steps.version.outputs.version_short }} \
                       -t ${{ steps.images.outputs.server_image }}:latest \
                       -f docker/Dockerfile.server .
          docker push ${{ steps.images.outputs.server_image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.images.outputs.server_image }}:${{ steps.version.outputs.version_short }}
          docker push ${{ steps.images.outputs.server_image }}:latest

      - name: Build and push base image
        run: |
          docker build -t ${{ steps.images.outputs.base_image }}:${{ steps.version.outputs.version }} \
                       -t ${{ steps.images.outputs.base_image }}:${{ steps.version.outputs.version_short }} \
                       -t ${{ steps.images.outputs.base_image }}:latest \
                       -f images/workspace-base/Dockerfile .
          docker push ${{ steps.images.outputs.base_image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.images.outputs.base_image }}:${{ steps.version.outputs.version_short }}
          docker push ${{ steps.images.outputs.base_image }}:latest

  create-release:
    name: Create GitHub Release
    needs: [build-fuse-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set image names
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "server_image=ghcr.io/${OWNER}/elevosandbox-server" >> $GITHUB_OUTPUT
          echo "base_image=ghcr.io/${OWNER}/elevosandbox-base" >> $GITHUB_OUTPUT

      - name: Download fuse-client amd64
        uses: actions/download-artifact@v4
        with:
          name: fuse-client-amd64
          path: release-assets/

      - name: Download fuse-client arm64
        uses: actions/download-artifact@v4
        with:
          name: fuse-client-arm64
          path: release-assets/

      - name: Prepare release assets
        run: |
          chmod +x release-assets/*
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/workspace-fuse-linux-amd64
            release-assets/workspace-fuse-linux-arm64
          body: |
            ## Docker Images

            ```bash
            # Pull the server image
            docker pull ${{ steps.images.outputs.server_image }}:${{ steps.version.outputs.version }}

            # Pull the base image
            docker pull ${{ steps.images.outputs.base_image }}:${{ steps.version.outputs.version }}
            ```

            ## FUSE Client Binaries

            Download the workspace-fuse client for your platform:
            - `workspace-fuse-linux-amd64` - Linux x86_64
            - `workspace-fuse-linux-arm64` - Linux ARM64

            The server Docker image includes both binaries at `/var/lib/workspace/downloads/`.
            SDK will auto-download from server, with GitHub as fallback.

            ## Quick Start

            ```bash
            # Start the server
            docker run -d \
              --name elevosandbox-server \
              -p 8080:8080 \
              -p 9090:9090 \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              ${{ steps.images.outputs.server_image }}:${{ steps.version.outputs.version }}
            ```

            See [deployment documentation](https://github.com/${{ github.repository }}/blob/main/docs/deployment.md) for more details.
